# Scoped real run — exercises the entire pipeline and every headline slide at modest
# cost (~3.6k Opus calls). Scale up via configs/trust.yaml for tight CIs.
env:
  M: 3
  T: 16                 # comfortably beyond the Bayes flip for every gap (verified)
  mu: 300.0
  theta_scale: 120.0
  sigma_B: 12.0

prior:                  # normative reputation-derived prior (favors A)
  sig0_A: 15.0
  sig0_B: 45.0
  nu0_A: 6.0
  nu0_B: 2.0

model:
  model_name: claude-opus-4-8
  max_tokens: 1024
  thinking: disabled    # adaptive is configurable; disabled for cost/reproducibility
  effort: null

design:
  gaps: [1.5, 2.0, 3.0, 5.0]
  anchor_gap: 2.0
  rep_strengths: [faint, moderate, strong]
  info_levels: [lean, self_history, summary, full]
  main_rep: moderate
  main_info: lean
  games: 20             # per condition (gap / rep / info sweeps)
  robust_games: 12      # per robustness + sanity condition
  robustness: [swap, order, paraphrase]

seed_base: 0
bootstrap: 2000
comprehension_games: 4
smoke_T: 6
output_root: results/scoped
max_calls: 8000
