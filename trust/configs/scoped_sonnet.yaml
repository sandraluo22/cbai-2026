# Scoped run via Anthropic API with Claude Sonnet 4.6 (structured outputs).
# Same design as scoped.yaml; model swapped to claude-sonnet-4-6, separate output dir.
env:
  M: 3
  T: 16
  mu: 300.0
  theta_scale: 120.0
  sigma_B: 12.0

prior:
  sig0_A: 15.0
  sig0_B: 45.0
  nu0_A: 6.0
  nu0_B: 2.0

model:
  model_name: claude-sonnet-4-6
  max_tokens: 1024
  thinking: disabled    # adaptive is configurable; disabled for cost/reproducibility
  effort: null

design:
  gaps: [1.5, 2.0, 3.0, 5.0]
  anchor_gap: 2.0
  rep_strengths: [faint, moderate, strong]
  info_levels: [lean, self_history, summary, full]
  main_rep: moderate
  main_info: lean
  games: 20
  robust_games: 12
  robustness: [swap, order, paraphrase]

seed_base: 0
bootstrap: 2000
comprehension_games: 4
smoke_T: 6
output_root: results/scoped_sonnet
max_calls: 8000
